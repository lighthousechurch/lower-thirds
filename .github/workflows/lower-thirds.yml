name: Lower thirds

# Wed–Sat at 10am and 7pm Pacific. GitHub cron is UTC, so each time is listed
# for both daylight (PDT) and standard (PST) time; the gate step keeps the one
# that matches this week. Once this week's email is drafted, later runs stop
# at the check step.
on:
  schedule:
    - cron: "7 17 * * 3-6"      # 10am PDT
    - cron: "7 18 * * 3-6"      # 10am PST
    - cron: "7 2 * * 4,5,6,0"   # 7pm PDT (next day in UTC)
    - cron: "7 3 * * 4,5,6,0"   # 7pm PST (next day in UTC)
  workflow_dispatch:
    inputs:
      thread:
        description: "Gmail thread id (blank = newest from Josh)"
        required: false
      dry_run:
        description: "Build the zip only, no draft"
        type: boolean
        default: false
      force:
        description: "Redo even if already drafted/replied"
        type: boolean
        default: false

concurrency: lower-thirds

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on Pacific time
        id: gate
        run: |
          zone=$(TZ=America/Los_Angeles date +%Z)
          case "${{ github.event.schedule }}" in
            "") ok=true ;;
            "7 17 * * 3-6"|"7 2 * * 4,5,6,0") [ "$zone" = PDT ] && ok=true || ok=false ;;
            *) [ "$zone" = PST ] && ok=true || ok=false ;;
          esac
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.gate.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Check for new slides email
        id: check
        if: steps.gate.outputs.ok == 'true'
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          args=(--check)
          [ -n "${{ inputs.thread }}" ] && args+=(--thread "${{ inputs.thread }}")
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python3 gmail_run.py "${args[@]}"
      - if: steps.check.outputs.run == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q tesseract-ocr tesseract-ocr-eng
      - name: Build lower thirds and draft reply
        if: steps.check.outputs.run == 'true'
        env:
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
        run: |
          args=()
          [ -n "${{ inputs.thread }}" ] && args+=(--thread "${{ inputs.thread }}")
          [ "${{ inputs.dry_run }}" = "true" ] && args+=(--dry-run)
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          python3 gmail_run.py "${args[@]}"
      - uses: actions/upload-artifact@v5
        if: steps.check.outputs.run == 'true'
        with:
          name: lower-thirds
          path: out/
          retention-days: 14
